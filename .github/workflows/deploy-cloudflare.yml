name: Deploy to Cloudflare Pages

# salimnote.pages.dev → click tracker → salimnote-links-autopilot.pages.dev 가 실제 프로필 링크 페이지다.
# 상품 동기화 워크플로는 GITHUB_TOKEN 으로 푸시해서 push 트리거가 걸리지 않으므로 workflow_run 으로도 받는다.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Refresh live products"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 18bf471a2cbabb422b850e12f813aff3
    steps:
      - name: Skip when the API token is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN secret is missing; skipping deploy."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != ''
        with:
          ref: main

      - name: Build site directory
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: >-
          npx -y wrangler@4 pages deploy _site
          --project-name salimnote-links-autopilot
          --branch main
          --commit-hash "$(git rev-parse --short HEAD)"
          --commit-message "$(git log -1 --pretty=%s)"
